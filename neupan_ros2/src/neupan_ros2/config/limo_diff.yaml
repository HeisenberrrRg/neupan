neupan_node:
  ros__parameters:
    use_sim_time: true
    
    # 【回归】必须匹配，设为 10.0
    control_frequency: 10.0
    
    device: 'cuda'

    neupan_config_file: 'neupan_sim_diff.yaml'
    dune_checkpoint_file: 'model_5000.pth'

    map_frame: 'map'
    base_frame: 'base_link'
    lidar_frame: 'laser_link'
    odom_frame: 'odom'

    enable_visualization: true
    enable_dune_markers: true
    enable_nrmp_markers: true
    enable_robot_marker: true
    marker_size: 0.05
    marker_z: 0.5

    scan_angle_max: 3.14
    scan_angle_min: -3.14
    
    # 车顶雷达，盲区设为 0.15 即可
    scan_range_min: 0.15
    
    scan_range_max: 12.0
    scan_downsample: 2
    flip_angle: false

    cmd_vel_topic: '/cmd_vel'
    scan_topic: '/scan'